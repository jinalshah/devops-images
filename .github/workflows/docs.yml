################################################################################
##                                                                            ##
##      ----==| P I P E L I N E   T O   P U B L I S H   D O C S |==----       ##
##                                                                            ##
################################################################################

name: docs

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - zensical.toml
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - zensical.toml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - run: pip install zensical ghp-import

      - run: zensical build --clean

      # Publish the built site to the gh-pages branch (only from main)
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ghp-import --no-jekyll --push --force --message "Deploy docs from ${GITHUB_SHA}" site
