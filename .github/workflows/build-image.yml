name: build-image

on:
  workflow_call:
    inputs:
      target:
        description: 'Dockerfile target to build (e.g., all-devops, aws-devops, gcp-devops)'
        type: string
        required: true
      version_prefix:
        description: 'Image version prefix (e.g., 1.0)'
        type: string
        required: true
      image_description:
        description: 'OCI image description published to the registries'
        type: string
        required: true
      gitlab_registry:
        description: 'GitLab Container Registry path'
        type: string
        required: true
      ghcr_registry:
        description: 'GitHub Container Registry path'
        type: string
        required: true
      dockerhub_registry:
        description: 'Docker Hub registry path'
        type: string
        required: true
      push_latest:
        description: 'Whether to push :latest tag (true for main branch, false for PRs)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:

  build:

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    runs-on: ${{ matrix.runner }}

    steps:

      - name: Set version
        run: |
          echo "VERSION=${{ inputs.version_prefix }}.$(echo $GITHUB_SHA | cut -c 1-7)" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
        shell: bash

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitLab Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.gitlab.com
          username: ${{ secrets.GITLAB_USERNAME }}
          password: ${{ secrets.GITLAB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GCR_GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push - ${{ inputs.target }} (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          target: ${{ inputs.target }}
          cache-from: type=gha,scope=${{ inputs.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.target }}-${{ matrix.arch }}
          build-args: |
            GCLOUD_VERSION=${{ vars.GCLOUD_VERSION }}
            PACKER_VERSION=${{ vars.PACKER_VERSION }}
            TERRAGRUNT_VERSION=${{ vars.TERRAGRUNT_VERSION }}
            TFLINT_VERSION=${{ vars.TFLINT_VERSION }}
            GHORG_VERSION=${{ vars.GHORG_VERSION }}
            K9S_VERSION=${{ vars.K9S_VERSION }}
            PYTHON_VERSION=${{ vars.PYTHON_VERSION }}
            PYTHON_VERSION_TO_USE=${{ vars.PYTHON_VERSION_TO_USE }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ env.BUILD_DATE }}
          annotations: |
            manifest:org.opencontainers.image.title=${{ inputs.target }}
            manifest:org.opencontainers.image.description=${{ inputs.image_description }}
            manifest:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            manifest:org.opencontainers.image.url=https://github.com/${{ github.repository }}
            manifest:org.opencontainers.image.documentation=https://jinalshah.github.io/devops-images/
            manifest:org.opencontainers.image.licenses=MIT
            manifest:org.opencontainers.image.vendor=Jinal Shah
            manifest:org.opencontainers.image.version=${{ env.VERSION }}
            manifest:org.opencontainers.image.revision=${{ github.sha }}
            manifest:org.opencontainers.image.created=${{ env.BUILD_DATE }}
          tags: |
            ${{ inputs.gitlab_registry }}/${{ inputs.target }}:${{ env.VERSION }}-${{ matrix.arch }}
            ${{ inputs.ghcr_registry }}/${{ inputs.target }}:${{ env.VERSION }}-${{ matrix.arch }}
            ${{ inputs.dockerhub_registry }}/${{ inputs.target }}:${{ env.VERSION }}-${{ matrix.arch }}
          push: true

  merge:

    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Set version
        run: |
          echo "VERSION=${{ inputs.version_prefix }}.$(echo $GITHUB_SHA | cut -c 1-7)" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
        shell: bash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitLab Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.gitlab.com
          username: ${{ secrets.GITLAB_USERNAME }}
          password: ${{ secrets.GITLAB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GCR_GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifest - ${{ inputs.target }}
        env:
          TARGET: ${{ inputs.target }}
          IMAGE_DESCRIPTION: ${{ inputs.image_description }}
          PUSH_LATEST: ${{ inputs.push_latest }}
          REPO_URL: https://github.com/${{ github.repository }}
        run: |
          REGISTRIES=(
            "${{ inputs.gitlab_registry }}"
            "${{ inputs.ghcr_registry }}"
            "${{ inputs.dockerhub_registry }}"
          )

          # OCI annotations have to be set on the manifest index itself: GHCR reads
          # the index (not the per-architecture image labels) when describing a
          # multi-arch package, and imagetools does not copy child metadata upwards.
          ANNOTATIONS=(
            --annotation "index:org.opencontainers.image.title=${TARGET}"
            --annotation "index:org.opencontainers.image.description=${IMAGE_DESCRIPTION}"
            --annotation "index:org.opencontainers.image.source=${REPO_URL}"
            --annotation "index:org.opencontainers.image.url=${REPO_URL}"
            --annotation "index:org.opencontainers.image.documentation=https://jinalshah.github.io/devops-images/"
            --annotation "index:org.opencontainers.image.licenses=MIT"
            --annotation "index:org.opencontainers.image.vendor=Jinal Shah"
            --annotation "index:org.opencontainers.image.version=${VERSION}"
            --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}"
            --annotation "index:org.opencontainers.image.created=${BUILD_DATE}"
          )

          for registry in "${REGISTRIES[@]}"; do
            echo "Creating multi-arch manifest for ${registry}/${TARGET}"

            TAGS=(-t "${registry}/${TARGET}:${VERSION}")

            # Add :latest tag only if push_latest is true
            if [ "$PUSH_LATEST" == "true" ]; then
              echo "Including :latest tag (main branch merge)"
              TAGS+=(-t "${registry}/${TARGET}:latest")
            else
              echo "Skipping :latest tag (PR build)"
            fi

            docker buildx imagetools create \
              "${ANNOTATIONS[@]}" \
              "${TAGS[@]}" \
              "${registry}/${TARGET}:${VERSION}-amd64" \
              "${registry}/${TARGET}:${VERSION}-arm64"
          done
        shell: bash
